<style>
    .cookie-banner {
        position: fixed;
        left: 24px; right: 24px; bottom: 24px;
        max-width: 760px;
        margin: 0 auto;
        background: var(--white);
        border-radius: 24px;
        box-shadow: 0 16px 60px rgba(12,104,128,0.28);
        border: 2px solid var(--blue);
        padding: 20px 24px;
        display: none;
        align-items: center;
        gap: 20px;
        z-index: 400;
    }
    .cookie-banner.show { display: flex; animation: cookieIn 0.4s ease; }
    .cookie-banner p {
        flex: 1;
        font-size: 0.85rem;
        font-weight: 600;
        line-height: 1.5;
        color: var(--dark);
    }
    .cookie-banner a { color: var(--dark); text-decoration: underline; }
    .cookie-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .cookie-btn {
        font-family: 'Nunito', sans-serif;
        font-weight: 900;
        font-size: 0.82rem;
        padding: 12px 20px;
        border-radius: 14px;
        cursor: pointer;
        border: 2px solid var(--dark);
        transition: all 0.2s;
    }
    .cookie-btn.accept { background: var(--dark); color: var(--white); }
    .cookie-btn.accept:hover { background: var(--orange); border-color: var(--orange); }
    .cookie-btn.decline { background: transparent; color: var(--dark); }
    .cookie-btn.decline:hover { background: #EBF7FC; }
    @keyframes cookieIn { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
    @media (max-width: 768px) {
        .cookie-banner { left: 12px; right: 12px; bottom: 12px; flex-direction: column; align-items: stretch; gap: 14px; padding: 18px; }
        .cookie-actions { width: 100%; }
        .cookie-btn { flex: 1; }
    }
</style>

<div class="cookie-banner" id="cookieBanner" role="dialog" aria-label="Использование cookie">
    <p>
        Мы используем файлы cookie, чтобы сайт работал корректно и был удобнее для вас.
        Продолжая пользоваться сайтом, вы соглашаетесь с использованием cookie.
        Подробнее — в <a href="{% url 'politics' %}#cookies">Политике конфиденциальности</a>.
    </p>
    <div class="cookie-actions">
        <button type="button" class="cookie-btn decline" onclick="setCookieConsent('necessary')">Только необходимые</button>
        <button type="button" class="cookie-btn accept" onclick="setCookieConsent('all')">Принять</button>
    </div>
</div>

<script>
    (function () {
        var KEY = 'agidelCookieConsent';
        var banner = document.getElementById('cookieBanner');
        function get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
        window.setCookieConsent = function (value) {
            try { localStorage.setItem(KEY, value); } catch (e) {}
            banner.classList.remove('show');
        };
        window.openCookieSettings = function () { banner.classList.add('show'); };
        if (!get()) setTimeout(function () { banner.classList.add('show'); }, 800);
    })();
</script>
